app: supertokens-with-postgresql
description: An open-source authentication solution that simplifies the implementation of secure user authentication and session management for web and mobile applications.
icon: https://raw.githubusercontent.com/jekyo/templates/main/supertokens-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the SuperTokens core
  POSTGRESQL_PASSWORD:
    kind: secret
  API_KEYS:
    kind: string
    default: ""
    required: false
    prompt: API keys to protect the core (comma-separated, optional)
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:latest
    env:
      API_KEYS: ${API_KEYS}
      POSTGRESQL_CONNECTION_URI: postgresql://supertokens:${POSTGRESQL_PASSWORD}@postgres:5432/supertokens
    port: 3567
    http:
      domain: ${DOMAIN}
    health:
      path: /hello
      port: 3567
  postgres:
    image: postgres:16
    env:
      POSTGRES_USER: supertokens
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: supertokens
    port: 5432
    health:
      command: ["pg_isready", "-U", "supertokens", "-d", "supertokens"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
