app: rustfs
description: RustFS: high-performance distributed storage system built with Rust, compatible with Amazon S3 APIs
icon: https://raw.githubusercontent.com/jekyo/templates/main/rustfs/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the S3 endpoint
  RUSTFS_SECRET_KEY:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  rustfs:
    image: rustfs/rustfs:latest
    args: ["/data"]
    env:
      RUSTFS_SERVER_URL: https://${DOMAIN}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: [9000, 9001]
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health"]
    volumes:
      data:
        path: /data
volumes:
  data:
    size: ${DATA_SIZE}
