app: postgres
description: PostgreSQL 16 with pgvector and persistent storage
icon: https://raw.githubusercontent.com/jekyo/templates/main/postgres/logo.svg
inputs:
  PG_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  postgres:
    image: pgvector/pgvector:pg16
    env:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    port: 5432
    volumes:
      pgdata: /var/lib/postgresql/data
volumes:
  pgdata:
    size: ${DATA_SIZE}
