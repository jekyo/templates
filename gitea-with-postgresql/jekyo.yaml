app: gitea-with-postgresql
description: Gitea: self-hosted, lightweight Git service for version control, collaboration, and code hosting, backed by PostgreSQL
icon: https://raw.githubusercontent.com/jekyo/templates/main/gitea-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your Gitea instance
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  gitea:
    image: gitea/gitea:latest
    env:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__server__ROOT_URL: https://${DOMAIN}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgresql
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
    volumes:
      data:
        path: /data
        subpath: gitea
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gitea
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U gitea -d gitea"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
volumes:
  data:
    size: ${DATA_SIZE}
