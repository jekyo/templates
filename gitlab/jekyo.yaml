app: gitlab
description: GitLab: the all-in-one DevOps platform for seamless collaboration and continuous delivery
icon: https://raw.githubusercontent.com/jekyo/templates/main/gitlab/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your GitLab instance
  GITLAB_ROOT_PASSWORD:
    kind: secret
  GITLAB_SMTP_ENABLE:
    kind: string
    default: "false"
    required: false
    prompt: Enable SMTP email (true/false)
  GITLAB_SMTP_ADDRESS:
    kind: string
    default: ""
    required: false
    prompt: SMTP server address
  GITLAB_SMTP_PORT:
    kind: string
    default: "587"
    required: false
    prompt: SMTP server port
  GITLAB_SMTP_USER_NAME:
    kind: string
    default: ""
    required: false
    prompt: SMTP user name
  GITLAB_SMTP_PASSWORD:
    kind: string
    default: ""
    required: false
    prompt: SMTP password
  GITLAB_EMAIL_FROM:
    kind: string
    default: ""
    required: false
    prompt: Email address GitLab sends from
  DATA_SIZE:
    kind: size
    default: 30Gi
    prompt: Storage size
services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    env:
      TZ: UTC
      GITLAB_TIMEZONE: UTC
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      EXTERNAL_URL: https://${DOMAIN}
      GITLAB_HOST: https://${DOMAIN}
      GITLAB_OMNIBUS_CONFIG: 'external_url "https://${DOMAIN}"; nginx["listen_https"] = false; nginx["listen_port"] = 80; gitlab_rails["gitlab_shell_ssh_port"] = 2222; gitlab_rails["smtp_enable"] = ${GITLAB_SMTP_ENABLE}; gitlab_rails["smtp_address"] = "${GITLAB_SMTP_ADDRESS}"; gitlab_rails["smtp_port"] = ${GITLAB_SMTP_PORT}; gitlab_rails["smtp_user_name"] = "${GITLAB_SMTP_USER_NAME}"; gitlab_rails["smtp_password"] = "${GITLAB_SMTP_PASSWORD}"; gitlab_rails["smtp_domain"] = "${GITLAB_SMTP_ADDRESS}"; gitlab_rails["smtp_authentication"] = "login"; gitlab_rails["smtp_enable_starttls_auto"] = true; gitlab_rails["smtp_tls"] = false; gitlab_rails["gitlab_email_from"] = "${GITLAB_EMAIL_FROM}"; gitlab_rails["gitlab_email_reply_to"] = "${GITLAB_EMAIL_FROM}";'
    port: 80
    http:
      domain: ${DOMAIN}
    volumes:
      config: /etc/gitlab
      logs: /var/log/gitlab
      data: /var/opt/gitlab
volumes:
  data:
    size: ${DATA_SIZE}
  config:
    size: 1Gi
  logs:
    size: 2Gi
