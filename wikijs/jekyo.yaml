app: wikijs
description: The most powerful and extensible open source Wiki software.
icon: https://raw.githubusercontent.com/jekyo/templates/main/wikijs/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your wiki
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  wikijs:
    image: ghcr.io/requarks/wiki:2
    env:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: wikijs
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: wiki-db
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_DB: wiki-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: wikijs
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U wikijs -d wiki-db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
volumes:
  data:
    size: ${DATA_SIZE}
