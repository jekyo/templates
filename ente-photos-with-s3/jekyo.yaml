app: ente-photos-with-s3
description: Ente Photos is a fully open source, End to End Encrypted alternative to Google Photos and Apple Photos.
icon: https://raw.githubusercontent.com/jekyo/templates/main/ente-photos-with-s3/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the Ente API (museum)
  WEB_DOMAIN:
    kind: domain
    prompt: Domain for the Ente web app
  S3_DOMAIN:
    kind: domain
    prompt: Domain for the MinIO S3 endpoint
  POSTGRES_PASSWORD:
    kind: secret
  MINIO_PASSWORD:
    kind: secret
  ENCRYPTION_KEY:
    kind: secret
  KEY_HASH:
    kind: secret
  JWT_SECRET:
    kind: secret
  SMTP_HOST:
    kind: string
    default: smtp.gmail.com
    required: false
    prompt: SMTP host
  SMTP_PORT:
    kind: string
    default: "587"
    required: false
    prompt: SMTP port
  SMTP_USERNAME:
    kind: string
    default: ""
    required: false
    prompt: SMTP username (optional)
  SMTP_PASSWORD:
    kind: string
    default: ""
    required: false
    prompt: SMTP password (optional)
  SMTP_EMAIL:
    kind: string
    default: ""
    required: false
    prompt: SMTP sender email (optional)
  SMTP_SENDER_NAME:
    kind: string
    default: Ente
    required: false
    prompt: SMTP sender name
  DATA_SIZE:
    kind: size
    default: 20Gi
    prompt: Storage size
services:
  museum:
    image: ghcr.io/ente-io/server:613c6a96390d7a624cf30b946955705d632423cc
    env:
      ENTE_DB_HOST: postgres
      ENTE_DB_PORT: "5432"
      ENTE_DB_NAME: ente_db
      ENTE_DB_USER: ente
      ENTE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      ENTE_HTTP_USE_TLS: "false"
      ENTE_S3_ARE_LOCAL_BUCKETS: "false"
      ENTE_S3_USE_PATH_STYLE_URLS: "true"
      ENTE_S3_B2_EU_CEN_KEY: ente
      ENTE_S3_B2_EU_CEN_SECRET: ${MINIO_PASSWORD}
      ENTE_S3_B2_EU_CEN_ENDPOINT: https://${S3_DOMAIN}
      ENTE_S3_B2_EU_CEN_REGION: eu-central-2
      ENTE_S3_B2_EU_CEN_BUCKET: b2-eu-cen
      ENTE_KEY_ENCRYPTION: ${ENCRYPTION_KEY}
      ENTE_KEY_HASH: ${KEY_HASH}
      ENTE_JWT_SECRET: ${JWT_SECRET}
      ENTE_INTERNAL_ADMIN: "1580559962386438"
      ENTE_INTERNAL_DISABLE_REGISTRATION: "false"
      ENTE_SMTP_HOST: ${SMTP_HOST}
      ENTE_SMTP_PORT: ${SMTP_PORT}
      ENTE_SMTP_USERNAME: ${SMTP_USERNAME}
      ENTE_SMTP_PASSWORD: ${SMTP_PASSWORD}
      ENTE_SMTP_EMAIL: ${SMTP_EMAIL}
      ENTE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      ENTE_SMTP_ENCRYPTION: tls
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /ping
      port: 8080
    volumes:
      data:
        path: /data
        subpath: museum-data
  web:
    image: ghcr.io/ente-io/web:ca03165f5e7f2a50105e6e40019c17ae6cdd934f
    env:
      ENTE_API_ORIGIN: https://${DOMAIN}
    port: 3000
    http:
      domain: ${WEB_DOMAIN}
    health:
      path: /
      port: 3000
  postgres:
    image: postgres:15-alpine
    env:
      POSTGRES_USER: ente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ente_db
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U ente -d ente_db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    args: ["server", "/data", "--console-address", ":9001"]
    env:
      MINIO_SERVER_URL: https://${S3_DOMAIN}
      MINIO_ROOT_USER: ente
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    port: 9000
    http:
      domain: ${S3_DOMAIN}
    health:
      command: ["mc", "ready", "local"]
    volumes:
      data:
        path: /data
        subpath: minio
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    command: ["/bin/sh", "-c"]
    args:
      - |
        sleep 5;
        until mc alias set minio http://minio:9000 ente ${MINIO_PASSWORD}; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        mc admin config set minio api cors_allow_origin='https://${DOMAIN},https://${WEB_DOMAIN}' || true;
        mc mb minio/b2-eu-cen --ignore-existing;
        mc mb minio/wasabi-eu-central-2-v3 --ignore-existing;
        mc mb minio/scw-eu-fr-v3 --ignore-existing;
        echo 'MinIO buckets and CORS configured';
        while true; do sleep 3600; done
volumes:
  data:
    size: ${DATA_SIZE}
