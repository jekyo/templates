app: vvveb
description: Powerful and easy to use cms to build websites, blogs or ecommerce stores.
icon: https://raw.githubusercontent.com/jekyo/templates/main/vvveb/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Vvveb
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  vvveb:
    image: vvveb/vvvebcms:latest
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
    volumes:
      data:
        path: /var/www/html
volumes:
  data:
    size: ${DATA_SIZE}
