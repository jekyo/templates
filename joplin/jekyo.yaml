app: joplin
description: Self-hosted sync server for Joplin
icon: https://raw.githubusercontent.com/jekyo/templates/main/joplin/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your Joplin server
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  joplin:
    image: joplin/server:latest
    env:
      APP_BASE_URL: https://${DOMAIN}
      DB_CLIENT: pg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: postgres
    port: 22300
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "bash -c ':> /dev/tcp/127.0.0.1/22300' || exit 1"]
  postgres:
    image: postgres:16
    env:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: joplin
      POSTGRES_DB: joplin
    port: 5432
    health:
      command: ["pg_isready", "-d", "joplin"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
