app: directus-with-postgresql
description: Directus wraps databases with a dynamic API, and provides an intuitive app for managing its content.
icon: https://raw.githubusercontent.com/jekyo/templates/main/directus-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Directus
  KEY:
    kind: secret
  SECRET:
    kind: secret
  ADMIN_PASSWORD:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  ADMIN_EMAIL:
    kind: string
    default: admin@example.com
    required: false
    prompt: Admin email address
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  directus:
    image: directus/directus:11
    env:
      PUBLIC_URL: https://${DOMAIN}
      KEY: ${KEY}
      SECRET: ${SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: postgres
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: GET,POST,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Content-Type,Authorization
      CORS_CREDENTIALS: "true"
    port: 8055
    http:
      domain: ${DOMAIN}
    health:
      path: /admin/login
      port: 8055
    volumes:
      data:
        path: /directus/uploads
        subpath: uploads
      data-extensions:
        path: /directus/extensions
      data-templates:
        path: /directus/templates
  postgresql:
    image: postgis/postgis:16-3.4-alpine
    env:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: directus
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U directus -d directus"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
  redis:
    image: redis:7-alpine
    args: ["redis-server", "--appendonly", "yes"]
    port: 6379
    health:
      command: ["redis-cli", "ping"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
  data-extensions:
    size: 1Gi
  data-templates:
    size: 1Gi
