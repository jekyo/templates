app: yamtrack-with-postgresql
description: Yamtrack is a self hosted media tracker for movies, tv shows, anime, manga, video games and books.
icon: https://raw.githubusercontent.com/jekyo/templates/main/yamtrack-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Yamtrack
  SECRET:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  TZ:
    kind: string
    default: Europe/Berlin
    required: false
    prompt: Timezone
  REGISTRATION:
    kind: string
    default: "true"
    required: false
    prompt: Enable user registration (true/false)
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack
    env:
      URLS: https://${DOMAIN}
      TZ: ${TZ}
      SECRET: ${SECRET}
      REGISTRATION: ${REGISTRATION}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_NAME: yamtrack-db
      DB_USER: yamtrack
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
    port: 8000
    http:
      domain: ${DOMAIN}
    health:
      path: /health/
      port: 8000
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: yamtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yamtrack-db
    port: 5432
    health:
      command: ["pg_isready", "-U", "yamtrack", "-d", "yamtrack-db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  redis:
    image: redis:7-alpine
    port: 6379
    health:
      command: ["redis-cli", "ping"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
