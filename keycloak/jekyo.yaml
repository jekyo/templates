app: keycloak
description: Keycloak is an open-source Identity and Access Management tool.
icon: https://raw.githubusercontent.com/jekyo/templates/main/keycloak/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your Keycloak instance
  ADMIN_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    args: ["start"]
    env:
      TZ: UTC
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      KC_HOSTNAME: https://${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /health/ready
      port: 9000
    volumes:
      data:
        path: /opt/keycloak/data
volumes:
  data:
    size: ${DATA_SIZE}
