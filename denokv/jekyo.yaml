app: denokv
description: Deno KV — the Denoland key-value database
icon: https://raw.githubusercontent.com/jekyo/templates/main/denokv/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Deno KV
  ACCESS_TOKEN:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  denokv:
    image: ghcr.io/denoland/denokv:latest
    args:
      - --sqlite-path
      - /data/denokv.sqlite
      - serve
      - --access-token
      - ${ACCESS_TOKEN}
    env:
      ACCESS_TOKEN: ${ACCESS_TOKEN}
    port: 4512
    http:
      domain: ${DOMAIN}
    health:
      command: ["nc", "-zv", "127.0.0.1", "4512"]
    volumes:
      data:
        path: /data
volumes:
  data:
    size: ${DATA_SIZE}
