app: excalidraw
description: Excalidraw: virtual whiteboard for sketching hand-drawn like diagrams
icon: https://raw.githubusercontent.com/jekyo/templates/main/excalidraw/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your whiteboard
services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
