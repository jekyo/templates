app: weblate
description: Weblate is a libre software web-based continuous localization system.
icon: https://raw.githubusercontent.com/jekyo/templates/main/weblate/logo.webp
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Weblate
  WEBLATE_ADMIN_EMAIL:
    kind: string
    default: admin@example.com
    required: false
    prompt: Admin email address
  WEBLATE_ADMIN_PASSWORD:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  REDIS_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  weblate:
    image: weblate/weblate:latest
    env:
      WEBLATE_SITE_DOMAIN: ${DOMAIN}
      WEBLATE_ADMIN_NAME: Admin
      WEBLATE_ADMIN_EMAIL: ${WEBLATE_ADMIN_EMAIL}
      WEBLATE_ADMIN_PASSWORD: ${WEBLATE_ADMIN_PASSWORD}
      DEFAULT_FROM_EMAIL: ${WEBLATE_ADMIN_EMAIL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: weblate
      POSTGRES_DATABASE: weblate
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 8080
    volumes:
      data:
        path: /app/data
        subpath: weblate
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: weblate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: weblate
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U weblate -d weblate"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
  redis:
    image: redis:7-alpine
    args: ["--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    env:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    port: 6379
    health:
      command: ["redis-cli", "ping"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
