app: traccar
description: Traccar is a free and open source modern GPS tracking system
icon: https://raw.githubusercontent.com/jekyo/templates/main/traccar/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the Traccar web interface
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  traccar:
    image: traccar/traccar:latest
    env:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    port: 8082
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 8082
    volumes:
      data:
        path: /opt/traccar/data
        subpath: traccar
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: traccar
    port: 5432
    health:
      command: ["pg_isready", "-U", "traccar", "-d", "traccar"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
