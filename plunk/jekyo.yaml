app: plunk
description: Plunk, The Open-Source Email Platform for AWS
icon: https://raw.githubusercontent.com/jekyo/templates/main/plunk/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Plunk
  POSTGRES_PASSWORD:
    kind: secret
  JWT_SECRET:
    kind: secret
  AWS_REGION:
    kind: string
    prompt: AWS region for SES (e.g. us-east-1)
  AWS_ACCESS_KEY_ID:
    kind: string
    prompt: AWS access key ID with SES permissions
  AWS_SECRET_ACCESS_KEY:
    kind: string
    prompt: AWS secret access key
  AWS_SES_CONFIGURATION_SET:
    kind: string
    prompt: AWS SES configuration set name
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  plunk:
    image: driaug/plunk:latest
    command: ["/app/entry.sh"]
    env:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://plunk:${POSTGRES_PASSWORD}@postgresql/plunk-db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET}
      NEXT_PUBLIC_API_URI: https://${DOMAIN}/api
      APP_URI: https://${DOMAIN}
      API_URI: https://${DOMAIN}/api
      DISABLE_SIGNUPS: "False"
      NODE_OPTIONS: --no-network-family-autoselection
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /api/health
      port: 3000
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: plunk-db
    port: 5432
    health:
      command: ["pg_isready", "-U", "plunk", "-d", "plunk-db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  redis:
    image: redis:7.4-alpine
    port: 6379
    health:
      command: ["redis-cli", "PING"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
