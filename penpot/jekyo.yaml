app: penpot
description: Penpot is the first Open Source design and prototyping platform for product teams.
icon: https://raw.githubusercontent.com/jekyo/templates/main/penpot/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Penpot
  PENPOT_SECRET_KEY:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  frontend:
    image: penpotapp/frontend:2.11.1
    env:
      PENPOT_FLAGS: enable-login-with-password
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 8080
    volumes:
      data:
        path: /opt/data/assets
        subpath: assets
  penpot-backend:
    image: penpotapp/backend:2.11.1
    env:
      PENPOT_FLAGS: enable-login-with-password enable-smtp
      PENPOT_HTTP_SERVER_PORT: "6060"
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}
      PENPOT_PUBLIC_URI: https://${DOMAIN}
      PENPOT_BACKEND_URI: http://penpot-backend
      PENPOT_EXPORTER_URI: http://penpot-exporter
      PENPOT_DATABASE_URI: postgresql://postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: mailpit
      PENPOT_SMTP_PORT: "1025"
      PENPOT_SMTP_USERNAME: penpot
      PENPOT_SMTP_PASSWORD: penpot
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"
    port: 6060
    health:
      path: /readyz
      port: 6060
    volumes:
      data:
        path: /opt/data/assets
        subpath: assets
  penpot-exporter:
    image: penpotapp/exporter:2.11.1
    env:
      PENPOT_PUBLIC_URI: https://${DOMAIN}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    port: 6061
    health:
      path: /readyz
      port: 6061
  mailpit:
    image: axllent/mailpit:v1.28
    ports: [1025, 8025]
    health:
      command: ["/mailpit", "readyz"]
  postgres:
    image: postgres:15
    env:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: penpot
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U penpot -d penpot"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  penpot-valkey:
    image: valkey/valkey:8.1
    env:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    port: 6379
    health:
      command: ["sh", "-c", "valkey-cli ping | grep PONG"]
    volumes:
      data:
        path: /data
        subpath: valkey
volumes:
  data:
    size: ${DATA_SIZE}
