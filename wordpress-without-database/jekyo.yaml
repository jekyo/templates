app: wordpress-without-database
description: WordPress is open source software you can use to create a beautiful website, blog, or app.
icon: https://raw.githubusercontent.com/jekyo/templates/main/wordpress-without-database/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your WordPress site
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  wordpress:
    image: wordpress:latest
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      command: ["curl", "-f", "http://127.0.0.1"]
    volumes:
      data:
        path: /var/www/html
volumes:
  data:
    size: ${DATA_SIZE}
