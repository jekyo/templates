app: grimmory
description: Grimmory is a self-hosted application for managing your entire book collection — organize, read, annotate, sync across devices, and share.
icon: https://raw.githubusercontent.com/jekyo/templates/main/grimmory/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Grimmory
  MARIADB_PASSWORD:
    kind: secret
  MARIADB_ROOT_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size for app data and database
  BOOKS_SIZE:
    kind: size
    default: 20Gi
    prompt: Storage size for your book library
services:
  grimmory:
    image: grimmory/grimmory:nightly-20260403-3a371f7
    env:
      USER_ID: "0"
      GROUP_ID: "0"
      TZ: UTC
      DATABASE_URL: jdbc:mariadb://mariadb:3306/grimmory-db
      DATABASE_USERNAME: grimmory
      DATABASE_PASSWORD: ${MARIADB_PASSWORD}
      BOOKLORE_PORT: "80"
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /health
      port: 80
    volumes:
      data:
        path: /app/data
        subpath: appdata
      data-books: /books
      data-bookdrop: /bookdrop
  mariadb:
    image: mariadb:12
    env:
      MARIADB_USER: grimmory
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: grimmory-db
    port: 3306
    health:
      command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mariadb
volumes:
  data:
    size: ${DATA_SIZE}
  data-books:
    size: ${BOOKS_SIZE}
  data-bookdrop:
    size: 5Gi
