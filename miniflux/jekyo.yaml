app: miniflux
description: Miniflux — a minimalist and opinionated feed reader
icon: https://raw.githubusercontent.com/jekyo/templates/main/miniflux/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Miniflux
  ADMIN_PASSWORD:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  miniflux:
    image: ghcr.io/miniflux/miniflux:latest
    env:
      BASE_URL: https://${DOMAIN}
      PORT: "8080"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_URL: postgres://miniflux:${POSTGRES_PASSWORD}@postgres:5432/miniflux-db?sslmode=disable
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 8080
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: miniflux-db
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U miniflux -d miniflux-db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
volumes:
  data:
    size: ${DATA_SIZE}
