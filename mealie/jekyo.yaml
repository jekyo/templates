app: mealie
description: Mealie: a recipe manager and meal planner
icon: https://raw.githubusercontent.com/jekyo/templates/main/mealie/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Mealie
  TZ:
    kind: string
    default: Europe/Berlin
    required: false
    prompt: Timezone
  ALLOW_SIGNUP:
    kind: string
    default: "true"
    required: false
    prompt: Allow public signup (true/false)
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:3.17.0
    env:
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      MAX_WORKERS: "1"
      WEB_CONCURRENCY: "1"
    port: 9000
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
    volumes:
      data: /app/data
volumes:
  data:
    size: ${DATA_SIZE}
