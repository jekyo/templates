app: flowise-with-databases
description: Flowise: open source low-code tool to build LLM orchestration flows and AI agents, with Postgres, Redis and Qdrant
icon: https://raw.githubusercontent.com/jekyo/templates/main/flowise-with-databases/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Flowise
  FLOWISE_PASSWORD:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  QDRANT_API_KEY:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  flowise:
    image: flowiseai/flowise:latest
    env:
      DEBUG: "false"
      DISABLE_FLOWISE_TELEMETRY: "true"
      PORT: "3001"
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
      FLOWISE_USERNAME: flowise
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}
    port: 3001
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3001
    volumes:
      data:
        path: /root/.flowise
        subpath: flowise
  pg-record-manager:
    image: postgres:16
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pg-record-manager
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -h localhost -U postgres -d pg-record-manager"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  redis-cache:
    image: redis:7
    port: 6379
    health:
      command: ["sh", "-c", "redis-cli -h localhost -p 6379 ping"]
    volumes:
      data:
        path: /data
        subpath: redis
  qdrant:
    image: qdrant/qdrant:latest
    env:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    port: 6333
    health:
      command: ["sh", "-c", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
    volumes:
      data:
        path: /qdrant/storage
        subpath: qdrant
volumes:
  data:
    size: ${DATA_SIZE}
