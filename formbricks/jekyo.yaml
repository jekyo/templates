app: formbricks
description: Formbricks: open source survey platform
icon: https://raw.githubusercontent.com/jekyo/templates/main/formbricks/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Formbricks
  S3_DOMAIN:
    kind: domain
    prompt: Domain for file uploads (MinIO S3, must be publicly reachable)
  POSTGRES_PASSWORD:
    kind: secret
  MINIO_PASSWORD:
    kind: secret
  NEXTAUTH_SECRET:
    kind: secret
  ENCRYPTION_KEY:
    kind: secret
  CRON_SECRET:
    kind: secret
  MAIL_FROM:
    kind: string
    default: test@example.com
    required: false
    prompt: Email sender address
  SMTP_HOST:
    kind: string
    default: test.example.com
    required: false
    prompt: SMTP host
  SMTP_PORT:
    kind: string
    default: "587"
    required: false
    prompt: SMTP port
  SMTP_USER:
    kind: string
    default: test
    required: false
    prompt: SMTP user
  SMTP_PASSWORD:
    kind: string
    default: test
    required: false
    prompt: SMTP password
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  formbricks:
    image: ghcr.io/formbricks/formbricks:4.5.0
    env:
      WEBAPP_URL: https://${DOMAIN}
      NEXTAUTH_URL: https://${DOMAIN}
      DATABASE_URL: postgres://formbricks:${POSTGRES_PASSWORD}@postgresql:5432/formbricks
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      MAIL_FROM: ${MAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE_ENABLED: "0"
      SMTP_REJECT_UNAUTHORIZED_TLS: "1"
      EMAIL_VERIFICATION_DISABLED: "1"
      PASSWORD_RESET_DISABLED: "1"
      EMAIL_AUTH_DISABLED: "0"
      INVITE_DISABLED: "0"
      RATE_LIMITING_DISABLED: "0"
      DEFAULT_ORGANIZATION_ROLE: owner
      REDIS_URL: redis://valkey:6379
      S3_ACCESS_KEY: formbricks
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_REGION: us-east-1
      S3_BUCKET_NAME: formbricks
      S3_ENDPOINT_URL: https://${S3_DOMAIN}
      S3_FORCE_PATH_STYLE: "1"
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
    volumes:
      data:
        path: /apps/web/uploads
        subpath: uploads
  postgresql:
    image: pgvector/pgvector:pg16
    env:
      POSTGRES_USER: formbricks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: formbricks
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U formbricks -d formbricks"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
  valkey:
    image: valkey/valkey:8-alpine
    args: ["valkey-server", "--appendonly", "yes"]
    port: 6379
    health:
      command: ["sh", "-c", "valkey-cli ping | grep PONG"]
    volumes:
      data:
        path: /data
        subpath: valkey
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    args: ["server", "/data", "--console-address", ":9001"]
    env:
      MINIO_SERVER_URL: https://${S3_DOMAIN}
      MINIO_ROOT_USER: formbricks
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    port: 9000
    http:
      domain: ${S3_DOMAIN}
    health:
      command: ["mc", "ready", "local"]
    volumes:
      data:
        path: /data
        subpath: minio
  minio-init:
    image: minio/mc:latest
    env:
      MC_INIT_PASSWORD: ${MINIO_PASSWORD}
    command:
      - sh
      - -c
      - >-
        mc alias set local http://minio:9000 formbricks "$$MC_INIT_PASSWORD" &&
        (mc mb -p local/formbricks || true) &&
        mc anonymous set private local/formbricks &&
        while true; do sleep 3600; done
volumes:
  data:
    size: ${DATA_SIZE}
