app: glpi
description: GLPI: free, open-source ITSM platform for IT asset management, helpdesk and service desk operations
icon: https://raw.githubusercontent.com/jekyo/templates/main/glpi/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for GLPI
  MYSQL_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  glpi:
    image: glpi/glpi:11
    env:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: "3306"
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: ${MYSQL_PASSWORD}
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
    volumes:
      data:
        path: /var/glpi
        subpath: glpi
  glpi-db:
    image: mysql:8
    env:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    port: 3306
    health:
      command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mysql
volumes:
  data:
    size: ${DATA_SIZE}
