app: soketi
description: Soketi is your simple, fast, and resilient open-source WebSockets server
icon: https://raw.githubusercontent.com/jekyo/templates/main/soketi/logo.jpeg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the Soketi WebSockets server
  SOKETI_APP_KEY:
    kind: secret
  SOKETI_APP_SECRET:
    kind: secret
  ENABLE_CLIENT_MESSAGES:
    kind: string
    default: "false"
    required: false
    prompt: Enable client messages (true/false)
services:
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    env:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: soketi
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET}
      SOKETI_PUSHER_SCHEME: https
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: ${ENABLE_CLIENT_MESSAGES}
    port: 6001
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "bash -c ':> /dev/tcp/127.0.0.1/6001' || exit 1"]
