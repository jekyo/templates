app: docuseal
description: "DocuSeal: open-source document signing, alternative to DocuSign"
icon: https://raw.githubusercontent.com/jekyo/templates/main/docuseal/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for DocuSeal
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  docuseal:
    image: docuseal/docuseal:latest
    env:
      # The ingress terminates TLS, so the app itself serves plain HTTP.
      # APP_URL is what DocuSeal reads to build the absolute links it
      # emails to signers (upstream's $HOST is a compose variable for
      # Caddy, not a container env var — DocuSeal never reads HOST).
      APP_URL: https://${DOMAIN}
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      # Rails' own endpoint: 200 without a redirect.
      path: /up
      port: 3000
      # First boot runs migrations before the app answers.
      grace: 180
    resources:
      cpu: 250m
      memory: 512Mi
      cpu-max: "2"
      memory-max: 2Gi
    # Let in-flight signing requests finish on a rollout.
    stop-grace: 60
    volumes:
      # SQLite database and uploaded documents both live under /data.
      data: /data
volumes:
  data:
    size: ${DATA_SIZE}
