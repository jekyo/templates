app: n8n-with-postgres-and-worker
description: n8n is an extendable workflow automation tool with queue mode and workers.
icon: https://raw.githubusercontent.com/jekyo/templates/main/n8n-with-postgres-and-worker/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for n8n
  POSTGRES_PASSWORD:
    kind: secret
  N8N_ENCRYPTION_KEY:
    kind: secret
  N8N_RUNNERS_AUTH_TOKEN:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  n8n:
    image: n8nio/n8n:2.10.4
    env:
      N8N_EDITOR_BASE_URL: https://${DOMAIN}
      WEBHOOK_URL: https://${DOMAIN}
      N8N_HOST: https://${DOMAIN}
      N8N_PROTOCOL: https
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: "false"
    ports: [5678, 5679]
    http:
      domain: ${DOMAIN}
    health:
      path: /healthz
      port: 5678
    volumes:
      data:
        path: /home/node/.n8n
        subpath: n8n
  n8n-worker:
    image: n8nio/n8n:2.10.4
    args: ["worker"]
    env:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PROXY_HOPS: "1"
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: "false"
    ports: [5679, 5678]
    health:
      path: /healthz
      port: 5678
    volumes:
      data:
        path: /home/node/.n8n
        subpath: n8n
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    port: 5432
    health:
      command: ["pg_isready", "-U", "n8n", "-d", "n8n"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
  redis:
    image: redis:6-alpine
    port: 6379
    health:
      command: ["redis-cli", "ping"]
    volumes:
      data:
        path: /data
        subpath: redis
  task-runners:
    image: n8nio/runners:2.10.4
    env:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
    health:
      command: ["sh", "-c", "wget -qO- http://127.0.0.1:5680/healthz"]
volumes:
  data:
    size: ${DATA_SIZE}
