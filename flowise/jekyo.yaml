app: flowise
description: "Flowise is an open source low-code tool for developers to build customized LLM orchestration flows & AI agents."
icon: https://raw.githubusercontent.com/jekyo/templates/main/flowise/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Flowise
  FLOWISE_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  flowise:
    image: flowiseai/flowise:latest
    env:
      DEBUG: "false"
      DISABLE_FLOWISE_TELEMETRY: "true"
      PORT: "3001"
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
      BLOB_STORAGE_PATH: /root/.flowise/storage
      FLOWISE_USERNAME: flowise
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}
    port: 3001
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3001
    volumes:
      data:
        path: /root/.flowise
volumes:
  data:
    size: ${DATA_SIZE}
