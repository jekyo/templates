app: activepieces
description: Open source no-code business automation.
icon: https://raw.githubusercontent.com/jekyo/templates/main/activepieces/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Activepieces
  API_KEY:
    kind: secret
  ENCRYPTION_KEY:
    kind: secret
  JWT_SECRET:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  activepieces:
    image: ghcr.io/activepieces/activepieces:0.75.0
    env:
      AP_API_KEY: ${API_KEY}
      AP_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_ENVIRONMENT: prod
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_FRONTEND_URL: https://${DOMAIN}
      AP_JWT_SECRET: ${JWT_SECRET}
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_USERNAME: activepieces
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: "6379"
      AP_SANDBOX_RUN_TIME_SECONDS: "600"
      AP_TELEMETRY_ENABLED: "false"
      AP_TEMPLATES_SOURCE_URL: https://cloud.activepieces.com/api/v1/flow-templates
      AP_TRIGGER_DEFAULT_POLL_INTERVAL: "5"
      AP_SIGN_UP_ENABLED: "true"
      AP_WEBHOOK_TIMEOUT_SECONDS: "30"
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      command: ["curl", "-f", "http://127.0.0.1:80"]
  postgres:
    image: postgres:18-alpine
    env:
      POSTGRES_DB: activepieces
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: activepieces
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U activepieces -d activepieces"]
    volumes:
      data:
        path: /var/lib/postgresql
        subpath: postgres
  redis:
    image: redis:7-alpine
    port: 6379
    health:
      command: ["redis-cli", "ping"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
