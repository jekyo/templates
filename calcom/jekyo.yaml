app: calcom
description: Scheduling infrastructure for everyone.
icon: https://raw.githubusercontent.com/jekyo/templates/main/calcom/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Cal.com
  NEXTAUTH_SECRET:
    kind: secret
  CALENDSO_ENCRYPTION_KEY:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  EMAIL_FROM:
    kind: string
    prompt: From address for outgoing emails
  EMAIL_FROM_NAME:
    kind: string
    prompt: From name for outgoing emails
  EMAIL_SERVER_HOST:
    kind: string
    prompt: SMTP server host
  EMAIL_SERVER_PORT:
    kind: string
    prompt: SMTP server port
  EMAIL_SERVER_USER:
    kind: string
    prompt: SMTP server username
  EMAIL_SERVER_PASSWORD:
    kind: string
    prompt: SMTP server password
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  calcom:
    image: calcom.docker.scarf.sh/calcom/cal.com
    env:
      NEXT_PUBLIC_LICENSE_CONSENT: agree
      NODE_ENV: production
      NEXT_PUBLIC_WEBAPP_URL: https://${DOMAIN}
      NEXT_PUBLIC_API_V2_URL: https://${DOMAIN}/api/v2
      NEXTAUTH_URL: https://${DOMAIN}/api/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calendso
      DATABASE_HOST: postgresql
      DATABASE_URL: postgresql://calcom:${POSTGRES_PASSWORD}@postgresql/calendso
      DATABASE_DIRECT_URL: postgresql://calcom:${POSTGRES_PASSWORD}@postgresql/calendso
      CALCOM_TELEMETRY_DISABLED: "1"
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD}
      NEXT_PUBLIC_APP_NAME: Cal.com
      ALLOWED_HOSTNAMES: '["${DOMAIN}"]'
    port: 3000
    http:
      domain: ${DOMAIN}
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calendso
    port: 5432
    health:
      command: ["pg_isready", "-U", "calcom", "-d", "calendso"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
volumes:
  data:
    size: ${DATA_SIZE}
