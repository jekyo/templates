app: forgejo-with-postgresql
description: "Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job."
icon: https://raw.githubusercontent.com/jekyo/templates/main/forgejo-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Forgejo
  POSTGRES_PASSWORD:
    kind: secret
  MIGRATIONS_ALLOWED_DOMAINS:
    kind: string
    default: ""
    required: false
    prompt: Allowed domains for repository migrations
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:8
    env:
      FORGEJO__server__ROOT_URL: https://${DOMAIN}
      FORGEJO__migrations__ALLOWED_DOMAINS: ${MIGRATIONS_ALLOWED_DOMAINS}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgresql
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
    volumes:
      data:
        path: /data
        subpath: forgejo
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forgejo
    port: 5432
    health:
      command: ["pg_isready", "-U", "forgejo", "-d", "forgejo"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
volumes:
  data:
    size: ${DATA_SIZE}
