app: readeck
description: Simple web application that lets you save the precious readable content of web pages you like and want to keep forever.
icon: https://raw.githubusercontent.com/jekyo/templates/main/readeck/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Readeck
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  readeck:
    image: codeberg.org/readeck/readeck:latest
    env:
      READECK_USE_X_FORWARDED: "true"
    port: 8000
    http:
      domain: ${DOMAIN}
    health:
      command: ["/bin/readeck", "healthcheck", "-config", "config.toml"]
    volumes:
      data:
        path: /readeck
volumes:
  data:
    size: ${DATA_SIZE}
