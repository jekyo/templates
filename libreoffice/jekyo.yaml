app: libreoffice
description: LibreOffice is a free and powerful office suite.
icon: https://raw.githubusercontent.com/jekyo/templates/main/libreoffice/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for LibreOffice
  TZ:
    kind: string
    default: Etc/UTC
    required: false
    prompt: Timezone
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
    volumes:
      data:
        path: /config
volumes:
  data:
    size: ${DATA_SIZE}
