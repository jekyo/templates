app: classicpress-without-database
description: A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg).
icon: https://raw.githubusercontent.com/jekyo/templates/main/classicpress-without-database/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your ClassicPress site
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  classicpress:
    image: classicpress/classicpress:latest
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      command: ["curl", "-f", "http://127.0.0.1"]
    volumes:
      data:
        path: /var/www/html
volumes:
  data:
    size: ${DATA_SIZE}
