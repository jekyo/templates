app: web-check
description: All-in-one OSINT tool for analysing any website
icon: https://raw.githubusercontent.com/jekyo/templates/main/web-check/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Web-Check
services:
  web-check:
    image: lissy93/web-check
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
