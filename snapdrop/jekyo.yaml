app: snapdrop
description: Snapdrop: self-hosted file sharing for secure and convenient transfers on a local network or the internet
icon: https://raw.githubusercontent.com/jekyo/templates/main/snapdrop/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Snapdrop
  TZ:
    kind: string
    default: Europe/Madrid
    required: false
    prompt: Timezone
  DATA_SIZE:
    kind: size
    default: 1Gi
    prompt: Storage size
services:
  snapdrop:
    image: linuxserver/snapdrop:version-b8b78cc2
    env:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
    volumes:
      data:
        path: /config
        subpath: config
volumes:
  data:
    size: ${DATA_SIZE}
