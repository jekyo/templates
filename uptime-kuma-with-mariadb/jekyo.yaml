app: uptime-kuma-with-mariadb
description: Uptime Kuma is a monitoring tool for tracking the status and performance of your applications in real-time.
icon: https://raw.githubusercontent.com/jekyo/templates/main/uptime-kuma-with-mariadb/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Uptime Kuma
  MARIADB_PASSWORD:
    kind: secret
  MARIADB_ROOT_PASSWORD:
    kind: secret
  TZ:
    kind: string
    default: Etc/UTC
    required: false
    prompt: Timezone
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    env:
      TZ: ${TZ}
    port: 3001
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "extra/healthcheck"]
    volumes:
      data:
        path: /app/data
        subpath: uptime-kuma
  mariadb:
    image: mariadb:11
    env:
      MYSQL_USER: uptimekuma
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: uptime-kuma-db
    port: 3306
    health:
      command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mariadb
volumes:
  data:
    size: ${DATA_SIZE}
