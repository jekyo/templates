app: goatcounter
description: GoatCounter: lightweight, privacy-friendly web analytics platform
icon: https://raw.githubusercontent.com/jekyo/templates/main/goatcounter/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for GoatCounter
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  goatcounter:
    image: arp242/goatcounter:2.7
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /status
      port: 8080
    volumes:
      data:
        path: /home/goatcounter/goatcounter-data
volumes:
  data:
    size: ${DATA_SIZE}
