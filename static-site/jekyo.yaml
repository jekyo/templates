app: mysite
description: Static site served by nginx, built from the ./public directory
icon: https://raw.githubusercontent.com/jekyo/templates/main/static-site/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the site
services:
  web:
    build:
      context: .
      inline: |
        FROM nginx:alpine
        COPY public/ /usr/share/nginx/html/
    port: 80
    http:
      domain: ${DOMAIN}
