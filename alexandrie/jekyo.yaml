app: alexandrie
description: A powerful Markdown workspace designed for speed, clarity, and creativity.
icon: https://raw.githubusercontent.com/jekyo/templates/main/alexandrie/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the Alexandrie frontend
  API_DOMAIN:
    kind: domain
    prompt: Domain for the Alexandrie API (backend)
  CDN_DOMAIN:
    kind: domain
    prompt: Domain for the file storage / CDN (rustfs)
  JWT_SECRET:
    kind: secret
  MYSQL_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  RUSTFS_SECRET_KEY:
    kind: secret
  SMTP_HOST:
    kind: string
    default: ""
    required: false
    prompt: SMTP host (optional)
  SMTP_MAIL:
    kind: string
    default: ""
    required: false
    prompt: SMTP mail address (optional)
  SMTP_PASSWORD:
    kind: string
    default: ""
    required: false
    prompt: SMTP password (optional)
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  frontend:
    image: ghcr.io/smaug6739/alexandrie-frontend:v8.10.0
    env:
      PORT: "8200"
      NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "false"
      NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "false"
      NUXT_PUBLIC_BASE_API: https://${API_DOMAIN}
      NUXT_PUBLIC_BASE_CDN: https://${CDN_DOMAIN}
      NUXT_PUBLIC_CDN_ENDPOINT: /alexandrie/
      NUXT_PUBLIC_BASE_URL: https://${DOMAIN}
    port: 8200
    http:
      domain: ${DOMAIN}
  backend:
    image: ghcr.io/smaug6739/alexandrie-backend:v8.10.0
    env:
      BACKEND_PORT: "8201"
      GIN_MODE: release
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      ALLOW_UNSECURE: "false"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: alexandrie-db
      DATABASE_USER: alexandrie
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ENDPOINT: rustfs:9000
      MINIO_PUBLIC_URL: https://${CDN_DOMAIN}
      MINIO_SECURE: "false"
      MINIO_ACCESSKEY: alexandrie
      MINIO_SECRETKEY: ${RUSTFS_SECRET_KEY}
      MINIO_BUCKET: alexandrie
      SMTP_HOST: ${SMTP_HOST}
      SMTP_MAIL: ${SMTP_MAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    port: 8201
    http:
      domain: ${API_DOMAIN}
  mysql:
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: alexandrie
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: alexandrie-db
    port: 3306
    health:
      command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mysql
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    env:
      RUSTFS_ACCESS_KEY: alexandrie
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_LOG_LEVEL: info
    port: 9000
    http:
      domain: ${CDN_DOMAIN}
    health:
      command: ["sh", "-c", "nc -z localhost 9000 || exit 1"]
    volumes:
      data:
        path: /data
        subpath: rustfs
volumes:
  data:
    size: ${DATA_SIZE}
