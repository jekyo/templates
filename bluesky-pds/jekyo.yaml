app: bluesky-pds
description: Bluesky PDS (Personal Data Server)
icon: https://raw.githubusercontent.com/jekyo/templates/main/bluesky-pds/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your PDS
  PDS_JWT_SECRET:
    kind: secret
  PDS_ADMIN_PASSWORD:
    kind: secret
  PDS_PLC_ROTATION_KEY:
    kind: secret
  PDS_ADMIN_EMAIL:
    kind: string
    prompt: Admin email address
  PDS_EMAIL_FROM_ADDRESS:
    kind: string
    prompt: From address for outbound email
  PDS_EMAIL_SMTP_URL:
    kind: string
    prompt: SMTP URL for outbound email (e.g. smtps://user:pass@host/)
  DATA_SIZE:
    kind: size
    default: 20Gi
    prompt: Storage size
services:
  pds:
    image: ghcr.io/bluesky-social/pds:0.4.182
    env:
      PDS_HOSTNAME: ${DOMAIN}
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}
      PDS_ADMIN_EMAIL: ${PDS_ADMIN_EMAIL}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_BLOB_UPLOAD_LIMIT: "104857600"
      PDS_DID_PLC_URL: https://plc.directory
      PDS_EMAIL_FROM_ADDRESS: ${PDS_EMAIL_FROM_ADDRESS}
      PDS_EMAIL_SMTP_URL: ${PDS_EMAIL_SMTP_URL}
      PDS_BSKY_APP_VIEW_URL: https://api.bsky.app
      PDS_BSKY_APP_VIEW_DID: did:web:api.bsky.app
      PDS_REPORT_SERVICE_URL: https://mod.bsky.app/xrpc/com.atproto.moderation.createReport
      PDS_REPORT_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndac
      PDS_CRAWLERS: https://bsky.network
      LOG_ENABLED: "true"
    args:
      - sh
      - -c
      - |
        set -euo pipefail
        echo "Installing required packages and pdsadmin..."
        apk add --no-cache openssl curl bash jq coreutils gnupg util-linux-misc >/dev/null
        curl -o /usr/local/bin/pdsadmin.sh https://raw.githubusercontent.com/bluesky-social/pds/main/pdsadmin.sh
        chmod 700 /usr/local/bin/pdsadmin.sh
        ln -sf /usr/local/bin/pdsadmin.sh /usr/local/bin/pdsadmin
        echo "Creating an empty pds.env file so pdsadmin works..."
        touch /pds/pds.env
        echo "Launching PDS, enjoy!..."
        exec node --enable-source-maps index.js
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /xrpc/_health
      port: 3000
    volumes:
      data:
        path: /pds
volumes:
  data:
    size: ${DATA_SIZE}
