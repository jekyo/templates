app: vvveb-with-mysql
description: Powerful and easy to use cms to build websites, blogs or ecommerce stores.
icon: https://raw.githubusercontent.com/jekyo/templates/main/vvveb-with-mysql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Vvveb
  VVVEB_DB_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  vvveb:
    image: vvveb/vvvebcms:latest
    env:
      DB_ENGINE: mysqli
      DB_HOST: mysql
      DB_USER: vvveb
      DB_PASSWORD: ${VVVEB_DB_PASSWORD}
      DB_NAME: vvveb
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
    volumes:
      data:
        path: /var/www/html
        subpath: vvveb
  mysql:
    image: mysql:8.4.2
    env:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vvveb
      MYSQL_USER: vvveb
      MYSQL_PASSWORD: ${VVVEB_DB_PASSWORD}
    port: 3306
    health:
      command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mysql
volumes:
  data:
    size: ${DATA_SIZE}
