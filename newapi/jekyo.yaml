app: newapi
description: The next-generation LLM gateway and AI asset management system supports multiple languages.
icon: https://raw.githubusercontent.com/jekyo/templates/main/newapi/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for New API
  POSTGRES_PASSWORD:
    kind: secret
  SESSION_SECRET:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  new-api:
    image: calciumion/new-api:v0.9.2.0
    env:
      SQL_DSN: "postgres://newapi:${POSTGRES_PASSWORD}@postgresql:5432/newapi?sslmode=disable&TimeZone=Asia/Shanghai"
      REDIS_CONN_STRING: "redis://redis:6379"
      TZ: "Asia/Shanghai"
      SESSION_SECRET: ${SESSION_SECRET}
      ERROR_LOG_ENABLED: "true"
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /api/status
      port: 3000
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newapi
    port: 5432
    health:
      command: ["pg_isready", "-U", "newapi", "-d", "newapi"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
  redis:
    image: redis:7-alpine
    port: 6379
    health:
      command: ["redis-cli", "PING"]
    volumes:
      data:
        path: /data
        subpath: redis
volumes:
  data:
    size: ${DATA_SIZE}
