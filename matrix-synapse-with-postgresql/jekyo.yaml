app: matrix-synapse-with-postgresql
description: Chat securely with your family, friends, community, or build great apps with Matrix!
icon: https://raw.githubusercontent.com/jekyo/templates/main/matrix-synapse-with-postgresql/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain Synapse is served on (e.g. matrix.example.org)
  SYNAPSE_SERVER_NAME:
    kind: string
    prompt: Matrix server name: permanent, cannot be changed later (e.g. example.org)
  ENABLE_REGISTRATION:
    kind: string
    default: "false"
    required: false
    prompt: Allow open user registration (true/false)
  ADMIN_PASSWORD:
    kind: secret
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  synapse:
    image: matrixdotorg/synapse:latest
    env:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_URL: https://${DOMAIN}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION}
      SERVICE_USER_ADMIN: admin
      SERVICE_PASSWORD_ADMIN: ${ADMIN_PASSWORD}
      SERVICE_USER_POSTGRESQL: synapse
      SERVICE_PASSWORD_POSTGRESQL: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse-db
    command:
      - /bin/bash
      - -c
      - |
        ! test -f /data/homeserver.yaml && /start.py generate

        # Extract secrets from generated config
        grep "registration_shared_secret" /data/homeserver.yaml \
        | awk '{print $$2}' > ./registration_shared_secret

        grep "macaroon_secret_key" /data/homeserver.yaml \
        | awk '{print $$2}' > ./macaroon_secret_key

        grep "form_secret" /data/homeserver.yaml \
        | awk '{print $$2}' > ./form_secret

        # Create homeserver.yaml with PostgreSQL
        cat <<EOF > /data/homeserver.yaml
        server_name: "$$SYNAPSE_SERVER_NAME"
        pid_file: /data/homeserver.pid
        public_baseurl: "$${SYNAPSE_URL}/"

        listeners:
          - port: 8008
            tls: false
            type: http
            x_forwarded: true
            bind_addresses: ['0.0.0.0']
            resources:
              - names: [client, federation]
                compress: false

        database:
          name: psycopg2
          args:
            user: $${SERVICE_USER_POSTGRESQL}
            password: $${SERVICE_PASSWORD_POSTGRESQL}
            database: $${POSTGRES_DB}
            host: postgres
            port: 5432
            cp_min: 5
            cp_max: 10

        log_config: "/data/$$SYNAPSE_SERVER_NAME.log.config"
        media_store_path: /data/media_store
        report_stats: $${SYNAPSE_REPORT_STATS}

        registration_shared_secret: $$(<./registration_shared_secret)
        macaroon_secret_key: $$(<./macaroon_secret_key)
        form_secret: $$(<./form_secret)
        signing_key_path: "/data/$$SYNAPSE_SERVER_NAME.signing.key"

        trusted_key_servers:
          - server_name: "matrix.org"
        EOF

        [ "$$ENABLE_REGISTRATION" = "true" ] && ! grep "#registration" /data/homeserver.yaml &>/dev/null \
        && echo >> /data/homeserver.yaml \
        && cat <<EOF >> /data/homeserver.yaml
        enable_registration: true
        EOF

        # Register admin user if provided
        register_admin(){
          while ! curl -sf http://localhost:8008/health > /dev/null; do
            sleep 2
          done
          register_new_matrix_user \
            -a \
            -u $${SERVICE_USER_ADMIN} \
            -p $${SERVICE_PASSWORD_ADMIN} \
            -c /data/homeserver.yaml \
            http://localhost:8008 &>/dev/null
        }
        [ -n "$${SERVICE_USER_ADMIN}" ] && register_admin &

        /start.py
    port: 8008
    http:
      domain: ${DOMAIN}
    health:
      path: /health
      port: 8008
    volumes:
      data:
        path: /data
        subpath: synapse
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse-db
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    port: 5432
    health:
      command: ["sh", "-c", "pg_isready -U synapse -d synapse-db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
