app: stirling-pdf
description: Stirling PDF — a powerful web based PDF manipulation tool
icon: https://raw.githubusercontent.com/jekyo/templates/main/stirling-pdf/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Stirling PDF
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    env:
      DOCKER_ENABLE_SECURITY: "false"
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "curl --fail --silent http://127.0.0.1:8080/api/v1/info/status | grep -q \"UP\" || exit 1"]
    volumes:
      data:
        path: /configs
      data-tessdata:
        path: /usr/share/tesseract-ocr/5/tessdata
      data-custom-files:
        path: /customFiles/
      data-logs:
        path: /logs/
volumes:
  data:
    size: ${DATA_SIZE}
  data-tessdata:
    size: 1Gi
  data-custom-files:
    size: 1Gi
  data-logs:
    size: 1Gi
