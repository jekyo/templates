app: metamcp
description: MCP Aggregator, Orchestrator, Middleware, Gateway in one app
icon: https://raw.githubusercontent.com/jekyo/templates/main/metamcp/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for MetaMCP
  POSTGRES_PASSWORD:
    kind: secret
  BETTER_AUTH_SECRET:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 2Gi
    prompt: Storage size
services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:2.4
    env:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "metamcp"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "metamcp_db"
      DATABASE_URL: postgresql://metamcp:${POSTGRES_PASSWORD}@postgres:5432/metamcp_db
      APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "false"
    port: 12008
    http:
      domain: ${DOMAIN}
    health:
      path: /health
      port: 12008
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: "metamcp"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: "metamcp_db"
    port: 5432
    health:
      command: ["pg_isready", "-U", "metamcp", "-d", "metamcp_db"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
