app: cyberchef
description: CyberChef — the Cyber Swiss Army Knife, a web app for encryption, encoding, compression and data analysis
icon: https://raw.githubusercontent.com/jekyo/templates/main/cyberchef/logo.jpeg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for CyberChef
  DATA_SIZE:
    kind: size
    default: 1Gi
    prompt: Storage size
services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
    volumes:
      data:
        path: /app/data
volumes:
  data:
    size: ${DATA_SIZE}
