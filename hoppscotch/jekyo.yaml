app: hoppscotch
description: Hoppscotch — the Open Source API Development Platform
icon: https://raw.githubusercontent.com/jekyo/templates/main/hoppscotch/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Hoppscotch
  POSTGRES_PASSWORD:
    kind: secret
  DATA_ENCRYPTION_KEY:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  backend:
    image: hoppscotch/hoppscotch:2026.2.1
    args: ["sh", "-c", "pnpx prisma migrate deploy && node /usr/src/app/aio_run.mjs"]
    env:
      VITE_ALLOWED_AUTH_PROVIDERS: GOOGLE,GITHUB,MICROSOFT,EMAIL
      DATABASE_URL: postgresql://hoppscotch:${POSTGRES_PASSWORD}@db:5432/hoppscotch
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      WHITELISTED_ORIGINS: https://${DOMAIN}/backend,https://${DOMAIN},https://${DOMAIN}/admin
      MAILER_USE_CUSTOM_CONFIGS: "true"
      VITE_BASE_URL: https://${DOMAIN}
      VITE_SHORTCODE_BASE_URL: https://${DOMAIN}
      VITE_ADMIN_URL: https://${DOMAIN}/admin
      VITE_BACKEND_GQL_URL: https://${DOMAIN}/backend/graphql
      VITE_BACKEND_WS_URL: wss://${DOMAIN}/backend/graphql
      VITE_BACKEND_API_URL: https://${DOMAIN}/backend/v1
      VITE_APP_TOS_LINK: https://docs.hoppscotch.io/support/terms
      VITE_APP_PRIVACY_POLICY_LINK: https://docs.hoppscotch.io/support/privacy
      ENABLE_SUBPATH_BASED_ACCESS: "true"
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 80
  db:
    image: postgres:15
    env:
      POSTGRES_USER: hoppscotch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hoppscotch
    port: 5432
    health:
      command: ["pg_isready", "-h", "localhost", "-U", "hoppscotch", "-d", "hoppscotch"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
volumes:
  data:
    size: ${DATA_SIZE}
