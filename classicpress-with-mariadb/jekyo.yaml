app: classicpress-with-mariadb
description: A lightweight, stable, instantly familiar free open-source content management system, based on WordPress without the block editor (Gutenberg).
icon: https://raw.githubusercontent.com/jekyo/templates/main/classicpress-with-mariadb/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for your site
  MYSQL_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  classicpress:
    image: classicpress/classicpress:latest
    env:
      CLASSICPRESS_DB_HOST: mariadb
      CLASSICPRESS_DB_USER: classicpress
      CLASSICPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      CLASSICPRESS_DB_NAME: classicpress
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      command: ["curl", "-f", "http://127.0.0.1"]
    volumes:
      data:
        path: /var/www/html
        subpath: classicpress
  mariadb:
    image: mariadb:11
    env:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: classicpress
      MYSQL_USER: classicpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    port: 3306
    health:
      command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mariadb
volumes:
  data:
    size: ${DATA_SIZE}
