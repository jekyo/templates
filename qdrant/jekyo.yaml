app: qdrant
description: Qdrant: production-ready vector similarity search engine with a convenient API to store, search, and manage vectors with payloads
icon: https://raw.githubusercontent.com/jekyo/templates/main/qdrant/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for the Qdrant API
  QDRANT_API_KEY:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  qdrant:
    image: qdrant/qdrant:latest
    env:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    port: 6333
    http:
      domain: ${DOMAIN}
    health:
      command: ["sh", "-c", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
    volumes:
      data:
        path: /qdrant/storage
        subpath: storage
volumes:
  data:
    size: ${DATA_SIZE}
