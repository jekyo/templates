# Catalog index for `jekyo templates` / `jekyo init <name>` and the
# website catalog page.
templates:
  - name: postgres
    description: PostgreSQL 16 with pgvector and persistent storage
    category: databases
    docs: https://www.postgresql.org/docs/
  - name: redis
    description: Redis 7 with append-only persistence
    category: databases
    docs: https://redis.io/docs/
  - name: ghost
    description: Ghost — professional publishing platform and CMS
    category: cms
    docs: https://ghost.org
  - name: static-site
    description: Static site served by nginx, built from the ./public directory
    category: web
    docs: https://nginx.org
