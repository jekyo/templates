app: gotify
description: Gotify is an open-source self-hosted notification server.
icon: https://raw.githubusercontent.com/jekyo/templates/main/gotify/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Gotify
  GOTIFY_USERNAME:
    kind: string
    default: admin
    required: false
    prompt: Default admin username
  GOTIFY_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 1Gi
    prompt: Storage size
services:
  gotify:
    image: gotify/server:2.7.3
    env:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_USERNAME}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_PASSWORD}
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DATABASE_CONNECTION: data/gotify.db
      GOTIFY_PASSSTRENGTH: "10"
      GOTIFY_UPLOADEDIMAGESDIR: data/images
      GOTIFY_PLUGINSDIR: data/plugins
      GOTIFY_SERVER_PORT: "80"
      GOTIFY_REGISTRATION: "false"
    port: 80
    http:
      domain: ${DOMAIN}
    health:
      path: /health
      port: 80
    volumes:
      data:
        path: /app/data
volumes:
  data:
    size: ${DATA_SIZE}
