app: glitchtip
description: GlitchTip: open-source error tracking system, compatible with Sentry SDKs
icon: https://raw.githubusercontent.com/jekyo/templates/main/glitchtip/logo.png
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for GlitchTip
  POSTGRES_PASSWORD:
    kind: secret
  SECRET_KEY:
    kind: secret
  EMAIL_URL:
    kind: string
    default: consolemail://
    required: false
    prompt: Email URL (e.g. smtp://user:pass@host:port)
  DEFAULT_FROM_EMAIL:
    kind: string
    default: test@example.com
    required: false
    prompt: Default from email address
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  web:
    image: glitchtip/glitchtip:6.0
    command: ["sh", "-c", "./manage.py migrate && ./bin/start.sh"]
    env:
      DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL}
      GLITCHTIP_DOMAIN: https://${DOMAIN}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    port: 8000
    http:
      domain: ${DOMAIN}
    volumes:
      data:
        path: /code/uploads
        subpath: uploads
  worker:
    image: glitchtip/glitchtip:6.0
    command: ["./bin/run-celery-with-beat.sh"]
    env:
      DATABASE_URL: postgres://glitchtip:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${SECRET_KEY}
      EMAIL_URL: ${EMAIL_URL}
      GLITCHTIP_DOMAIN: https://${DOMAIN}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      data:
        path: /code/uploads
        subpath: uploads
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: glitchtip
    port: 5432
    health:
      command: ["pg_isready", "-U", "glitchtip", "-d", "glitchtip"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgres
  redis:
    image: redis
    port: 6379
    health:
      command: ["redis-cli", "ping"]
volumes:
  data:
    size: ${DATA_SIZE}
