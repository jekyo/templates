app: sonarqube
description: SonarQube is a self-managed, automatic code review tool that systematically helps you deliver Clean Code
icon: https://raw.githubusercontent.com/jekyo/templates/main/sonarqube/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for SonarQube
  POSTGRES_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  sonarqube:
    image: sonarqube:community
    env:
      SONAR_JDBC_URL: jdbc:postgresql://postgresql:5432/sonar
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    port: 9000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 9000
    volumes:
      data:
        path: /opt/sonarqube/data
        subpath: sonarqube
      data-extensions:
        path: /opt/sonarqube/extensions
      data-logs:
        path: /opt/sonarqube/logs
  postgresql:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sonar
    port: 5432
    health:
      command: ["pg_isready", "-U", "sonarqube", "-d", "sonar"]
    volumes:
      data:
        path: /var/lib/postgresql/data
        subpath: postgresql
volumes:
  data:
    size: ${DATA_SIZE}
  data-extensions:
    size: 2Gi
  data-logs:
    size: 1Gi
