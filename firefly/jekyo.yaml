app: firefly
description: Firefly III — a personal finances manager that can help you save money
icon: https://raw.githubusercontent.com/jekyo/templates/main/firefly/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Firefly III
  APP_KEY:
    kind: secret
  MYSQL_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  CRON_TOKEN:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 5Gi
    prompt: Storage size
services:
  firefly:
    image: fireflyiii/core:latest
    env:
      APP_URL: https://${DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_CONNECTION: mysql
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${MYSQL_PASSWORD}
      STATIC_CRON_TOKEN: ${CRON_TOKEN}
      TRUSTED_PROXIES: "*"
    port: 8080
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 8080
    volumes:
      data:
        path: /var/www/html/storage/upload
        subpath: upload
  mysql:
    image: mariadb:11
    env:
      MYSQL_USER: firefly
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: firefly
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    port: 3306
    health:
      command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mysql
  cron:
    image: alpine
    schedule: "0 3 * * *"
    env:
      STATIC_CRON_TOKEN: ${CRON_TOKEN}
    command: ["sh", "-c", "wget -qO- http://firefly:8080/api/v1/cron/$STATIC_CRON_TOKEN"]
volumes:
  data:
    size: ${DATA_SIZE}
