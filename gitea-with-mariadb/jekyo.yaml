app: gitea-with-mariadb
description: Gitea — self-hosted, lightweight Git service for version control, collaboration, and code hosting
icon: https://raw.githubusercontent.com/jekyo/templates/main/gitea-with-mariadb/logo.svg
inputs:
  DOMAIN:
    kind: domain
    prompt: Domain for Gitea
  MYSQL_PASSWORD:
    kind: secret
  MYSQL_ROOT_PASSWORD:
    kind: secret
  DATA_SIZE:
    kind: size
    default: 10Gi
    prompt: Storage size
services:
  gitea:
    image: gitea/gitea:latest
    env:
      GITEA__server__ROOT_URL: https://${DOMAIN}
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: mysql
      GITEA__database__HOST: mariadb
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${MYSQL_PASSWORD}
    port: 3000
    http:
      domain: ${DOMAIN}
    health:
      path: /
      port: 3000
    volumes:
      data:
        path: /data
        subpath: gitea
  mariadb:
    image: mariadb:11
    env:
      MYSQL_USER: gitea
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: gitea
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    port: 3306
    health:
      command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
    volumes:
      data:
        path: /var/lib/mysql
        subpath: mariadb
volumes:
  data:
    size: ${DATA_SIZE}
